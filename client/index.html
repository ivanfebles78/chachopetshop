<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chacho Pet Shop — Nutrición premium y accesorios para perros, gatos, aves y más. Envío rápido a toda Canarias."
    />
    <title>Chacho Pet Shop · Nutrición premium para tu mascota</title>
    <!--
      La foto del hero, pedida ya durante el análisis del HTML.

      Esto es una aplicación de una sola página: el `<img>` no está en este
      documento, lo crea React después de descargar y ejecutar el JavaScript.
      Sin este `preload`, el navegador no se entera de que existe la imagen más
      grande de la primera pantalla hasta bastante tarde, y esa imagen es
      justamente la que mide como LCP.

      Es la ÚNICA imagen que se precarga. Precargarlo todo equivale a no
      priorizar nada.
    -->
    <link rel="preload" as="image" href="/banner-chacho.jpeg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
